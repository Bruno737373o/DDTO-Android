name: Build Android DDTO (Direct Download Mode)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Install Libraries (No-Git Strategy)
        run: |
          haxelib setup ~/haxelib
          
          # Bibliotecas padrão que funcionam
          haxelib install lime 8.1.2 --always --quiet
          haxelib install openfl 9.3.3 --always --quiet
          haxelib install flixel 5.5.0 --always --quiet
          haxelib install flixel-tools --always --quiet
          haxelib install flixel-ui --always --quiet
          haxelib install flixel-addons --always --quiet
          haxelib install tjson --always --quiet
          haxelib install hxvlc --always --quiet
          haxelib install actuate --always --quiet
          haxelib install hxcpp --always --quiet

          # FUNÇÃO PARA BAIXAR ZIP E EXTRAIR (Bypass Git)
          download_zip() {
            local url=$1
            local name=$2
            echo "Baixando $name..."
            curl -L $url -o /tmp/$name.zip
            mkdir -p ~/haxelib/$name/git
            unzip -q /tmp/$name.zip -d /tmp/$name-tmp
            cp -R /tmp/$name-tmp/*/* ~/haxelib/$name/git
            haxelib dev $name ~/haxelib/$name/git
          }

          # Baixando as bibliotecas problemáticas via ZIP direto
          download_zip "https://github.com/SrtRuslan/faxe/archive/refs/heads/main.zip" "faxe"
          download_zip "https://github.com/MasterAres157/polymod/archive/refs/heads/master.zip" "polymod"
          download_zip "https://github.com/Aidan63/linc_discord-rpc/archive/refs/heads/master.zip" "discord_rpc"
          download_zip "https://github.com/MaysSperandio/extension-androidtools/archive/refs/heads/main.zip" "extension-androidtools"
          download_zip "https://github.com/nebulazorua/linc_luajit/archive/refs/heads/master.zip" "linc_luajit"

      - name: Configure Android
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime setup android "${{ github.workspace }}" "${{ steps.setup-java.outputs.path }}" "$ANDROID_SDK_ROOT" "$ANDROID_NDK_LATEST_HOME"
          haxelib run lime config ANDROID_SDK $ANDROID_SDK_ROOT
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME

      - name: Patch Source Code
        run: |
          sed -i '99s/$/;/' source/KeyBindSubstate.hx || echo "Arquivo não encontrado."

      - name: Build Android
        run: haxelib run lime build android -release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DDTO-Plus-Android-Build
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
