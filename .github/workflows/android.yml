name: Build Android DDTO (Universal Fix)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Install Libraries
        run: |
          haxelib setup ~/haxelib
          
          # FORÇA O GIT A USAR HTTPS SEM PEDIR USUÁRIO
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          
          # Bibliotecas padrão
          haxelib install lime 8.1.2 --always --quiet
          haxelib install openfl 9.3.3 --always --quiet
          haxelib install flixel 5.5.0 --always --quiet
          haxelib install flixel-tools --always --quiet
          haxelib install flixel-ui --always --quiet
          haxelib install flixel-addons --always --quiet
          haxelib install tjson --always --quiet
          haxelib install hxvlc --always --quiet
          haxelib install actuate --always --quiet
          haxelib install hxcpp --always --quiet

          # CLONAGEM MANUAL COM LINKS ATUALIZADOS
          # Faxe (Link do SrtRuslan é o mais estável para Android)
          git clone https://github.com/SrtRuslan/faxe.git ~/haxelib/faxe/git --depth 1
          haxelib dev faxe ~/haxelib/faxe/git

          # Polymod
          git clone https://github.com/MasterAres157/polymod.git ~/haxelib/polymod/git --depth 1
          haxelib dev polymod ~/haxelib/polymod/git

          # Discord RPC
          git clone https://github.com/Aidan63/linc_discord-rpc.git ~/haxelib/discord_rpc/git --depth 1
          haxelib dev discord_rpc ~/haxelib/discord_rpc/git

          # Android Tools (Link atualizado do MAJ0R-Z ou alternativo estável)
          git clone https://github.com/MaysSperandio/extension-androidtools.git ~/haxelib/extension-androidtools/git --depth 1
          haxelib dev extension-androidtools ~/haxelib/extension-androidtools/git

          # LuaJit
          git clone https://github.com/nebulazorua/linc_luajit.git ~/haxelib/linc_luajit/git --depth 1
          haxelib dev linc_luajit ~/haxelib/linc_luajit/git

      - name: Configure Android
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime setup android "${{ github.workspace }}" "${{ steps.setup-java.outputs.path }}" "$ANDROID_SDK_ROOT" "$ANDROID_NDK_LATEST_HOME"
          haxelib run lime config ANDROID_SDK $ANDROID_SDK_ROOT
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME

      - name: Patch Source Code
        run: |
          # Corrige o erro de ponto e vírgula na linha 99 do KeyBindSubstate.hx
          sed -i '99s/$/;/' source/KeyBindSubstate.hx || echo "Aviso: KeyBindSubstate.hx não encontrado."

      - name: Build Android
        run: haxelib run lime build android -release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DDTO-Plus-Android-Build
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
