name: Build Android DDTO (Final Stability)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Install Libraries
        run: |
          haxelib setup ~/haxelib
          
          # Bibliotecas básicas
          haxelib install lime 8.1.2 --always
          haxelib install openfl 9.3.3 --always
          haxelib install flixel 5.5.0 --always
          haxelib install flixel-tools --always
          haxelib install flixel-ui --always
          haxelib install flixel-addons --always
          haxelib install tjson --always
          haxelib install hxvlc --always
          haxelib install actuate --always
          haxelib install hxcpp --always

          # Instalando bibliotecas via GIT usando o formato mais compatível do Haxelib
          haxelib git faxe https://github.com/SrtRuslan/faxe --always
          haxelib git polymod https://github.com/MasterAres157/polymod --always
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc --always
          haxelib git extension-androidtools https://github.com/MaysSperandio/extension-androidtools --always
          haxelib git linc_luajit https://github.com/nebulazorua/linc_luajit --always

      - name: Configure Android
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime setup android "${{ github.workspace }}" "${{ steps.setup-java.outputs.path }}" "$ANDROID_SDK_ROOT" "$ANDROID_NDK_LATEST_HOME"
          haxelib run lime config ANDROID_SDK $ANDROID_SDK_ROOT
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME

      - name: Patch Source Code
        run: |
          # Corrige o erro de ponto e vírgula na linha 99 do KeyBindSubstate.hx
          # Usamos um comando que verifica se o arquivo existe antes de tentar editar
          if [ -f "source/KeyBindSubstate.hx" ]; then
            sed -i '99s/$/;/' source/KeyBindSubstate.hx
            echo "Patch aplicado."
          else
            echo "Arquivo não encontrado, pulando patch."
          fi

      - name: Build Android
        run: haxelib run lime build android -release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DDTO-Plus-APK
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
